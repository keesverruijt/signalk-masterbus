name: publish

# On a v* tag: fetch the pinned masterbus daemons, build, test, create the
# GitHub release with the packed tarball (what a hand install uses), then
# publish to npm. The npm step needs trusted publishing to be configured
# for the package on npmjs.com, which in turn needs the package to exist
# there: the very first version is published by hand.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit --no-fund
      - run: npm run fetch-daemons
      - run: npm run build
      - run: npm test
      - run: npm pack
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: signalk-masterbus-*.tgz
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later; Node
      # 22 ships npm 10, which signs the provenance and then publishes with
      # setup-node's placeholder token, and npm answers 404.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public
